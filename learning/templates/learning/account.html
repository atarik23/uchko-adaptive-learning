{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uchko — Sign in</title>
  <link rel="stylesheet" href="{% static 'learning/css/styles.css' %}">
</head>
<body>
<div class="account-wrap">
  <div class="brand" style="margin-bottom: 1.5rem;">
    <div class="logo">U</div>
    <div>
      <p class="title">Uchko</p>
      <p class="subtitle">Adaptive learning demo</p>
    </div>
  </div>

  {% if flash_messages %}
    <div class="flash-area">
      {% for fm in flash_messages %}
        <div class="flash flash-{{ fm.level }}">{{ fm.message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <div class="card">
    <div class="card-title">Create new user</div>
    <form action="{% url 'learning:create_user' %}" method="post">
      {% csrf_token %}
      <label for="new_username">Username</label>
      <input type="text" id="new_username" name="new_username" placeholder="e.g. tarik" autofocus>
      <div style="margin-top: 0.7rem;">
        <button class="btn btn-primary" type="submit">Create / Use</button>
      </div>
    </form>
  </div>

  {% if users %}
    <div class="card">
      <div class="card-title">Or pick existing user</div>
      <form action="{% url 'learning:select_user' %}" method="post">
        {% csrf_token %}
        <label for="username">User</label>
        <select id="username" name="username">
          {% for u in users %}
            <option value="{{ u }}">{{ u }}</option>
          {% endfor %}
        </select>
        <div style="margin-top: 0.7rem;">
          <button class="btn" type="submit">Continue</button>
        </div>
      </form>
    </div>
  {% endif %}
</div>
</body>
</html>
