<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uchko — Login</title>
</head>
<body>
    <main>
        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div>
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            {% for field in form %}
                <div>
                    {{ field.label_tag }}
                    {{ field }}

                    {% if field.errors %}
                        <div>
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit">Login</button>
        </form>

        <p>
            Do not have an account?
            <a href="{% url 'accounts:register' %}">Register as a student</a>
        </p>
    </main>
</body>
</html>
